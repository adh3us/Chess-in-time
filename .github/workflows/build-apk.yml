name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "chess_in_time/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess_in_time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Run engine tests
        run: flutter test test/chess_engine_test.dart

      - name: Build APK (release)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: chess-in-time-apk
          path: chess_in_time/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
